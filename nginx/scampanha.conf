# Scampanha - Nginx Configuration
# Coloque em /etc/nginx/sites-available/scampanha
# depois: ln -sfn /etc/nginx/sites-available/scampanha /etc/nginx/sites-enabled/scampanha

upstream scampanha {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name SEU_IP_AQUI;

    location / {
        proxy_pass http://scampanha;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/scampanha_access.log;
    error_log /var/log/nginx/scampanha_error.log;

    # Max upload
    client_max_body_size 10M;

    # Assets estáticos com cache
    location /_next/static {
        proxy_pass http://scampanha;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }
}
